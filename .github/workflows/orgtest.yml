name: Run Jest Tests with testPathPattern

on:
  push:
    branches:
      - COIS-4000-Students  
  pull_request:
    branches:
      - COIS-4000-Students  

jobs:
  test:
    runs-on: ubuntu-latest  

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14' 

    - name: Install dependencies
      run: npm install  

    - name: Run Jest tests with testPathPattern
      run: npm test -- --testPathPattern=OrgDash  
